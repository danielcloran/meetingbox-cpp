name: Compile

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libx11-dev libxrandr-dev libxi-dev libudev-dev libgl1-mesa-dev git

      - name: Run project install script (pulls external libraries via vcpkg & builds required libs)
        run: |
          chmod +x install.sh
          ./install.sh

      - name: Configure CMake (Ninja generator)
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -- -j$(nproc)