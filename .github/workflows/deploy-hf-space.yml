name: Deploy TimeBox demo Space

on:
  push:
    branches: [master, main]
    paths:
      - "spaces/timebox-timer-demo/**"
      - ".github/workflows/deploy-hf-space.yml"
  workflow_dispatch:

concurrency:
  group: deploy-timebox-timer-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check the Space app
        run: python -m py_compile spaces/timebox-timer-demo/app.py
      - name: Install huggingface_hub
        run: pip install -U "huggingface_hub[cli]>=0.26"
      - name: Ensure Space exists and sync files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "Missing repo secret HF_TOKEN (write access)"; exit 1; }
          SPACE_ID="${HF_SPACE_ID:-danielcloran/timebox-timer-demo}"
          SRC=spaces/timebox-timer-demo
          hf repos create "$SPACE_ID" --type space --space-sdk gradio --public --exist-ok
          hf upload "$SPACE_ID" "$SRC" . --repo-type space
          echo "Deployed to https://huggingface.co/spaces/${SPACE_ID}"
          echo "MCP https://${SPACE_ID/\//-}.hf.space/gradio_api/mcp/"
